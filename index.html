<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HER OWN is a digital companion for women living independently, safely, and freely."
    />
    <title>HER OWN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css?v=20260806-day-layout-final7" />
    <link rel="stylesheet" href="css/layout.css?v=20260806-day-layout-final7" />
    <link rel="stylesheet" href="css/components.css?v=20260806-day-layout-final7" />
    <link rel="stylesheet" href="css/pages.css?v=20260806-day-layout-final7" />
    <link rel="stylesheet" href="css/responsive.css?v=20260806-day-layout-final7" />
  </head>
  <body>
    <div class="app-frame">
      <header class="topbar" id="topbar">
        <button class="brand" type="button" data-page="home" aria-label="Go to home">
          <span class="brand-mark">H</span>
          <span>HER OWN</span>
        </button>
        <nav class="main-nav" aria-label="Primary navigation">
          <button class="nav-link is-active" type="button" data-page="home">Home</button>
          <button class="nav-link" type="button" data-page="day">HER Day</button>
          <button class="nav-link" type="button" data-page="places">HER Places</button>
          <button class="nav-link" type="button" data-page="living">HER Living</button>
          <button class="nav-link" type="button" data-page="safe">HER Safe</button>
          <button class="nav-link" type="button" data-page="my">My Page</button>
        </nav>
        <div class="topbar-actions">
          <button class="assistant-pill" type="button" aria-label="Open HER Assistant">
            <span data-i18n="assistantName">HER Assistant</span>
            <span aria-hidden="true">☏</span>
          </button>
          <select class="language-select" id="languageSelect" aria-label="Language">
            <option value="en">EN</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
          <button class="mobile-menu" type="button" aria-label="Toggle menu">
            <span></span>
            <span></span>
          </button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>

      <button class="assistant-launch" type="button" aria-label="Open HER Assistant">
        <span>HER</span>
      </button>

      <aside class="assistant-panel" id="assistantPanel" aria-label="HER Assistant" aria-hidden="true">
        <div class="assistant-head">
          <div>
            <p class="eyebrow" data-i18n="assistantName">HER Assistant</p>
            <h2 data-i18n="assistantTitle">I'm here with you.</h2>
          </div>
          <button class="icon-button assistant-close" type="button" aria-label="Close assistant">×</button>
        </div>
        <div class="assistant-log" id="assistantLog"></div>
        <div class="assistant-prompts" aria-label="Suggested questions">
          <button type="button" data-prompt="I feel like someone is following me." data-i18n="promptFollowed">Being followed</button>
          <button type="button" data-prompt="There is a stranger at my door." data-i18n="promptDoor">At my door</button>
          <button type="button" data-prompt="I want a gentle solo day today." data-i18n="promptSoloDay">Solo day</button>
        </div>
        <form class="assistant-form" id="assistantForm">
          <input id="assistantInput" type="text" placeholder="Ask HER..." autocomplete="off" />
          <button type="submit" aria-label="Send">↑</button>
        </form>
      </aside>

      <div class="phone-overlay" id="phoneOverlay" aria-hidden="true">
        <div class="phone-screen" role="dialog" aria-modal="true" aria-label="Fake call">
          <div class="caller-avatar" id="callerAvatar">M</div>
          <p class="incoming-label" id="incomingLabel">Incoming call</p>
          <h2 id="callerName">Mom</h2>
          <p id="callerLine">Are you there?</p>
          <div class="call-actions">
            <button class="call-end" type="button" id="declineCall" aria-label="Decline call">×</button>
            <button class="call-answer" type="button" id="answerCall" aria-label="Answer call">✓</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js?v=20260806-day-layout-final7"></script>
  </body>
</html>
